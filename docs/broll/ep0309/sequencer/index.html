<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EP0309 B-roll Sequencer</title>

  <!-- Fonts (Korean-safe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />

  <style>
    html,body,#app{margin:0;width:100%;height:100%;background:#0b1020;overflow:hidden}
    #hud{position:fixed;left:12px;top:12px;z-index:9999;background:rgba(0,0,0,.45);color:#fff;padding:8px 10px;border-radius:10px;font:12px/1.2 system-ui;backdrop-filter: blur(6px)}
    #help{position:fixed;right:12px;top:12px;z-index:9999;background:rgba(0,0,0,.35);color:#fff;padding:8px 10px;border-radius:10px;font:12px/1.25 system-ui;opacity:.85}
    a{color:#ffb347}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="help">Space: Pause/Play · ←/→: Prev/Next</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
